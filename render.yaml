# Receta de despliegue para Render (New → Blueprint). Publica el front como Static Site gratuito.
services:
  - type: web
    name: clustr
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Las rutas (/groups, /people…) las resuelve la app: cualquier dirección sirve index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # El login con Google abre una ventana emergente que responde con postMessage.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      # Los archivos con hash en el nombre no cambian nunca: se pueden guardar en caché un año.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Dirección de la API terminada en /api, p. ej. https://clustr-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
